[theme]
# Base type size — body text, captions, and dataframe cells all scale
# from this. 16 is the Streamlit default; the owner tried 18 and 17
# and settled back on 16. Tables keep the roomier 40px rows.
baseFontSize = 16

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# never show tracebacks (which could include paths/config) to viewers
showErrorDetails = false
