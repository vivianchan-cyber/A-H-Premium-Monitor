[theme]
# Larger type for readability (senior-friendly): everything scales from
# this — body text, captions, and dataframe cells. Streamlit default: 16.
baseFontSize = 18

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# never show tracebacks (which could include paths/config) to viewers
showErrorDetails = false
